{% extends "base.html" %}
{% block title %}{{ 'Edit Tender' if tender else 'Add Tender' }} — PVC Calculation Studio{% endblock %}

{% block content %}
<div class="pvc-page-header">
  <div>
    <div class="pvc-section-label">Contract Master</div>
    <h1 class="pvc-page-title">{{ 'Edit Tender' if tender else 'Add New Tender' }}</h1>
  </div>
  <div class="d-flex gap-2">
    <a href="{{ url_for('admin.tenders_list') }}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i>Back to Tenders
    </a>
  </div>
</div>

<form method="post" action="{{ url_for('admin.tenders_edit', tenderid=tender.id) if tender else url_for('admin.tenders_new') }}">
  <div class="card">
    <div class="card-header">
      <h6 class="fw-bold mb-0"><i class="bi bi-file-earmark-text me-2 text-primary"></i>Tender Details</h6>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="tenderItem">Item <span class="text-danger">*</span></label>
          <select id="tenderItem" name="itemid" class="form-select" required>
            <option value="">-- Select Item --</option>
            {% for it in items %}
            <option value="{{ it.id }}" {% if tender and tender.item_id == it.id %}selected{% endif %}>
              {{ it.name }}{% if it.pvc_formula_code %} ({{ it.pvc_formula_code }}){% endif %}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label" for="tenderNo">Tender No <span class="text-danger">*</span></label>
          <input id="tenderNo" type="text" name="tenderno" class="form-control mono-num" required
                 placeholder="e.g. TND/EL/2025/001"
                 value="{{ tender.tender_no if tender else '' }}">
        </div>

        <div class="col-md-3">
          <label class="form-label" for="tenderBasicRate">Basic Rate (₹)</label>
          <input id="tenderBasicRate" type="number" step="0.01" name="basicrate" class="form-control mono-num"
                 placeholder="0.00"
                 value="{{ tender.basicrate if tender and tender.basicrate != null else '' }}">
        </div>

        <div class="col-md-3">
          <label class="form-label" for="tenderBaseDate">PVC Base Date</label>
          <input id="tenderBaseDate" type="date" name="pvcbasedate" class="form-control mono-num"
                 value="{{ tender.pvcbasedate if tender and tender.pvcbasedate else '' }}">
        </div>

        <div class="col-md-3">
          <label class="form-label" for="tenderFreight">Freight / Unit (₹)</label>
          <input id="tenderFreight" type="number" step="0.01" name="freightrateperunit" class="form-control mono-num"
                 placeholder="0.00"
                 value="{{ tender.freightrateperunit if tender and tender.freightrateperunit != null else '' }}">
        </div>

        <div class="col-md-3">
          <label class="form-label" for="tenderGst">GST (%)</label>
          <input id="tenderGst" type="number" step="0.01" min="0" max="100" name="gst_rate" class="form-control mono-num"
                 placeholder="18"
                 value="{{ tender.gst_rate if tender and tender.gst_rate != null else '18' }}">
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
        <a href="{{ url_for('admin.tenders_list') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-check2-circle me-1"></i>{{ 'Update Tender' if tender else 'Create Tender' }}
        </button>
      </div>
    </div>
  </div>
</form>
{% endblock %}

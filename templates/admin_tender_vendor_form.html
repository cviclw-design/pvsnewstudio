{% extends "base.html" %}
{% block title %}{{ 'Edit Vendor' if row else 'Add Vendor' }} — {{ tender.tender_no }}{% endblock %}

{% block content %}
<div class="pvc-page-header">
  <div>
    <div class="pvc-section-label">Tender Vendors</div>
    <h1 class="pvc-page-title">{{ 'Edit Vendor' if row else 'Add Vendor' }} — {{ tender.tender_no }}</h1>
  </div>
  <div class="d-flex gap-2">
    <a href="{{ url_for('admin.tender_vendors_list', tenderid=tender.id) }}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i>Back to Vendors
    </a>
  </div>
</div>

<form method="post" action="{{ url_for('admin.tender_vendors_edit', tenderid=tender.id, rowid=row.id) if row else url_for('admin.tender_vendors_new', tenderid=tender.id) }}">
  <div class="card">
    <div class="card-header">
      <h6 class="fw-bold mb-0"><i class="bi bi-building me-2 text-primary"></i>Vendor Commercial Details</h6>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="vendorName">Vendor Name <span class="text-danger">*</span></label>
          <input id="vendorName" type="text" name="vendorname" class="form-control" required
                 placeholder="e.g. Alpha Drive Systems"
                 value="{{ row.vendor_name if row else '' }}">
        </div>

        <div class="col-md-6">
          <label class="form-label" for="vendorPo">PO No</label>
          <input id="vendorPo" type="text" name="pono" class="form-control mono-num"
                 placeholder="e.g. PO/2025/001"
                 value="{{ row.po_no if row and row.po_no else '' }}">
        </div>

        <div class="col-md-4">
          <label class="form-label" for="vendorCif">Original CIF</label>
          <input id="vendorCif" type="number" step="any" name="cif" class="form-control mono-num"
                 placeholder="0.00"
                 value="{{ row.cif if row and row.cif != null else '0' }}">
        </div>

        <div class="col-md-4">
          <label class="form-label" for="vendorCurr">Currency <span class="text-danger">*</span></label>
          <input id="vendorCurr" type="text" name="currency" class="form-control mono-num" required
                 list="currencyPresets"
                 value="{{ row.currency if row else 'EUR' }}">
          <datalist id="currencyPresets">
            <option value="EUR">
            <option value="USD">
            <option value="JPY">
            <option value="GBP">
            <option value="INR">
          </datalist>
        </div>

        <div class="col-md-4">
          <label class="form-label" for="vendorFrt">Freight (per unit ₹)</label>
          <input id="vendorFrt" type="number" step="any" name="freightrateperunit" class="form-control mono-num"
                 placeholder="0.00"
                 value="{{ row.freightrateperunit if row and row.freightrateperunit != null else '0' }}">
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
        <a href="{{ url_for('admin.tender_vendors_list', tenderid=tender.id) }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-check2-circle me-1"></i>{{ 'Update Vendor' if row else 'Create Vendor' }}
        </button>
      </div>
    </div>
  </div>
</form>
{% endblock %}

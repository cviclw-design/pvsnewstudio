{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<style>
  body {
    background: url('https://upload.wikimedia.org/wikipedia/commons/4/4e/Vande_Sadharan.jpg') no-repeat center center fixed !important;
    background-size: cover !important;
  }
  /* Hide standard navbar */
  body > nav.navbar { display: none !important; }
  body > .container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
  .card {
    background-color: rgba(255, 255, 255, 0.94);
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    backdrop-filter: blur(6px);
  }
</style>

<!-- Custom Full-Width Header -->
<div class="p-3 shadow-sm w-100 text-center mb-5" style="background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);">
  <h3 class="mb-0 text-white fw-bold"><i class="bi bi-train-front-fill me-2"></i> CLW Data Mining & Tools Portal</h3>
</div>

<div class="container row justify-content-center mx-auto">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header bg-white py-3 border-bottom-0">
        <h5 class="mb-0 text-primary fw-bold"><i class="bi bi-box-arrow-in-right me-1"></i> Login</h5>
      </div>
      <div class="card-body">
        <form method="post" action="">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </button>
            <a href="{{ url_for('auth.register') }}" class="small">Need an account? Register</a>
          </div>
        </form>
        <div class="mt-3 pt-2 border-top small text-muted">
          Default Admin: <code>admin</code> / <code>admin123</code> &nbsp;|&nbsp; Operator: <code>operator</code> / <code>user123</code>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

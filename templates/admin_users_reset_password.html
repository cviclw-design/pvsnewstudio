{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="pvc-page-header">
  <div>
    <div class="pvc-section-label">User Management</div>
    <h1 class="pvc-page-title">Reset Password</h1>
  </div>
  <div class="d-flex gap-2">
    <a href="{{ url_for('admin.users_list') }}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i>Back to Users
    </a>
  </div>
</div>

<form method="post" action="{{ url_for('admin.users_reset_password', userid=user.id) }}">
  <div class="card" style="max-width: 560px;">
    <div class="card-body d-flex flex-column gap-3">
      <div>
        <label class="form-label">User Account</label>
        <input type="text" class="form-control mono-num" value="{{ user.username }}" disabled>
      </div>

      <div>
        <label class="form-label" for="newPassword">New Password <span class="text-danger">*</span></label>
        <input id="newPassword" type="password" name="password" class="form-control" required autofocus>
      </div>

      <div class="d-flex justify-content-end gap-2 pt-2 border-top">
        <a href="{{ url_for('admin.users_list') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">
          <i class="bi bi-key-fill me-1"></i>Reset Password
        </button>
      </div>
    </div>
  </div>
</form>
{% endblock %}

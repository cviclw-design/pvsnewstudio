{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-1">Reset Password</h3>
  <a href="{{ url_for('admin.users_list') }}" class="btn btn-outline-secondary">Back to Users</a>
</div>

<form method="post">
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label fw-semibold">User</label>
        <input type="text" class="form-control" value="{{ user.username }}" disabled>
        <small class="text-muted">You are resetting the password for this user.</small>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">New Password</label>
        <input type="password" name="password" class="form-control" required autofocus>
      </div>

      <div class="text-end">
        <button type="button" class="btn btn-outline-secondary me-2" onclick="window.history.back()">Cancel</button>
        <button type="submit" class="btn btn-danger">
          <i class="bi bi-key-fill me-1"></i> Reset Password
        </button>
      </div>
    </div>
  </div>
</form>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ 'Edit User' if user else 'Add User' }} — PVC Calculation Studio{% endblock %}

{% block content %}
<div class="pvc-page-header">
  <div>
    <div class="pvc-section-label">Administration</div>
    <h1 class="pvc-page-title">{{ 'Edit User' if user else 'Add User' }}</h1>
  </div>
  <div class="d-flex gap-2">
    <a href="{{ url_for('admin.users_list') }}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i>Back to Users
    </a>
  </div>
</div>

<form method="post" action="{{ url_for('admin.users_edit', userid=user.id) if user else url_for('admin.users_new') }}">
  <div class="card">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Username <span class="text-danger">*</span></label>
          <input type="text" name="username" class="form-control" required value="{{ user.username if user else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" value="{{ user.email if user and user.email else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Full Name</label>
          <input type="text" name="fullname" class="form-control" value="{{ user.full_name if user and user.full_name else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Designation / Role</label>
          <input type="text" name="designation" class="form-control" value="{{ user.designation if user and user.designation else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Reference ID</label>
          <input type="text" name="controlno" class="form-control mono-num" value="{{ user.control_no if user and user.control_no else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Password {% if not user %}<span class="text-danger">*</span>{% endif %}</label>
          <input type="password" name="password" class="form-control" {% if not user %}required{% else %}placeholder="Unchanged if blank"{% endif %}>
        </div>
        <div class="col-12 pt-2">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="isAdminSwitch" name="is_admin" value="1"
                   {% if user and user.is_admin %}checked{% endif %}
                   {% if user and user.id == current_user.id %}disabled{% endif %}>
            <label class="form-check-label fw-semibold" for="isAdminSwitch">Administrator Privileges</label>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
        <a href="{{ url_for('admin.users_list') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-check2-circle me-1"></i>{{ 'Update User' if user else 'Create User' }}
        </button>
      </div>
    </div>
  </div>
</form>
{% endblock %}

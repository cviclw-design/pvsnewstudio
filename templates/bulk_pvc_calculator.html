{% extends "base.html" %}
{% block title %}Bulk PVC Calculator — PVC Calculation Studio{% endblock %}

{% block content %}
<div class="pvc-page-header">
  <div>
    <div class="pvc-section-label">Batch Workbook Processor</div>
    <h1 class="pvc-page-title">Bulk PVC Calculation</h1>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <h6 class="fw-bold mb-0"><i class="bi bi-file-earmark-spreadsheet me-2 text-primary"></i>Excel Workbook Upload</h6>
  </div>
  <div class="card-body">
    <form method="post" action="{{ url_for('pvc.bulk_calculate') }}" enctype="multipart/form-data">
      <div class="row g-3">
        <div class="col-12">
          <label for="data_file" class="form-label">Select Input Excel File (.xlsx / .xls)</label>
          <input class="form-control" type="file" id="data_file" name="data_file" accept=".xlsx, .xls" required>
        </div>
      </div>

      <div class="d-flex justify-content-end mt-4 pt-3 border-top">
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-play-circle me-1"></i>Process Workbook &amp; Download Report
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
